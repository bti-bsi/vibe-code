id = "vibe-code"
name = "Vibe Code"
version = "0.1.0"
schema_version = 1
authors = ["Vibe Team"]
description = "Vibe Code Agent Server Extension for Zed"
repository = "https://github.com/VibeLM/vibe-code"

[agent_servers.vibe-code]
name = "Vibe Code"
icon = "vibe-code.svg"

[agent_servers.vibe-code.targets.darwin-aarch64]
archive = "https://registry.npmjs.org/@vibe-code/vibe-code/-/vibe-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.vibe-code.targets.darwin-x86_64]
archive = "https://registry.npmjs.org/@vibe-code/vibe-code/-/vibe-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.vibe-code.targets.linux-x86_64]
archive = "https://registry.npmjs.org/@vibe-code/vibe-code/-/vibe-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.vibe-code.targets.windows-x86_64]
archive = "https://registry.npmjs.org/@vibe-code/vibe-code/-/vibe-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

